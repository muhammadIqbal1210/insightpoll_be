name: Backend CI/CD Pipeline

on:
  push:
    branches: production
  pull_request:
    branches: production
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. Test & Lint Check (Continuous Integration)
  # ========================================================
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=optional

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Run Build Check
        run: npm run build
        env:
          PORT: 4000
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
          JWT_SECRET: "test-secret"
          LOGIN_SECRET_KEY: "test-login"

  # ========================================================
  # 2. Build & Deploy via SSH / Docker (Continuous Deployment)
  # ========================================================
  deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Pindah ke direktori project backend di server
            cd ${{ secrets.VPS_BACKEND_DIR || '~/insightpoll_be' }}

            # Tarik kode terbaru
            git pull origin ${{ github.ref_name }}

            # Build dan restart container Docker
            docker compose down
            docker compose up -d --build

            # Bersihkan cache image lama
            docker image prune -f

            echo "🚀 Backend successfully deployed!"
